worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $uri $scene_log_route {
        ~^/(verify|login|challenge)/[^/]+$ /$1/:token;
        default $uri;
    }

    log_format scene_access escape=json '{"time":"$time_iso8601","edge_request_id":"$request_id",'
        '"backend_request_id":"$upstream_http_x_request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","route":"$scene_log_route",'
        '"status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout scene_access;
    error_log /dev/stderr warn;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=86400" always;
    reset_timedout_connection on;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 10s;
    keepalive_requests 500;
    large_client_header_buffers 2 8k;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 16m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript application/json image/svg+xml text/css text/javascript;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_zone $binary_remote_addr zone=portal_requests:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=portal_connections:10m;

    upstream portal_backend { server backend:8080; keepalive 8; }
    upstream editor_backend { server backend:8082; keepalive 4; }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 64k;

        location ^~ /internal/torrentharbor-management/ { return 404; }
        location ~* (?:^|/)\.(?:env(?:\.|$)|git(?:/|$)|hg(?:/|$)|svn(?:/|$)) { return 404; }
        location ~* (?:^|/)(?:composer\.(?:json|lock)|package-lock\.json|yarn\.lock|web\.config|server-status)(?:$|/) { return 404; }

        location = /healthz {
            proxy_pass http://portal_backend/healthz;
        }

        location / {
            limit_req zone=portal_requests burst=40 nodelay;
            limit_conn portal_connections 20;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Portal-Source-IP $remote_addr;
            proxy_set_header X-Management-Source-IP "";
            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_pass http://portal_backend;
        }
    }

    server {
        listen 8081;
        server_name _;
        client_max_body_size 16m;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # The portable editor listener is loopback-only. Production uses
            # the authenticated TrueNAS gateway configuration instead.
            proxy_set_header X-Scene-Admin local-development;
            proxy_set_header X-Portal-Source-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Management-Source-IP "";
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://editor_backend;
        }
    }
}
