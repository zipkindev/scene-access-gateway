worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format scene_access escape=json '{"time":"$time_iso8601","edge_request_id":"$request_id",'
        '"backend_request_id":"$upstream_http_x_request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","request_uri":"$request_uri","uri":"$uri",'
        '"status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout scene_access;
    error_log /dev/stderr warn;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 8m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_zone $binary_remote_addr zone=portal_requests:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=portal_connections:10m;

    upstream portal_backend { server backend:8080; keepalive 8; }
    upstream editor_backend { server backend:8082; keepalive 4; }

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            proxy_pass http://portal_backend/healthz;
        }

        location / {
            limit_req zone=portal_requests burst=40 nodelay;
            limit_conn portal_connections 20;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Portal-Source-IP $remote_addr;
            proxy_pass http://portal_backend;
        }
    }

    server {
        listen 8081;
        server_name _;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # The portable editor listener is loopback-only. Production uses
            # the authenticated TrueNAS gateway configuration instead.
            proxy_set_header X-Scene-Admin local-development;
            proxy_set_header X-Portal-Source-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://editor_backend;
        }
    }
}
