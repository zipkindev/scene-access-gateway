worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 8m;

    upstream portal_backend { server backend:8080; keepalive 8; }
    upstream editor_backend { server backend:8082; keepalive 4; }

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            proxy_pass http://portal_backend/healthz;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Portal-Source-IP $remote_addr;
            proxy_pass http://portal_backend;
        }
    }

    server {
        listen 8081;
        server_name _;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # The portable editor listener is loopback-only. Production uses
            # the authenticated TrueNAS gateway configuration instead.
            proxy_set_header X-Scene-Admin local-development;
            proxy_set_header X-Portal-Source-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://editor_backend;
        }
    }
}
