# CRS attack-family scores are populated by rules 930-942. In the global
# DetectionOnly posture, promote only transactions with a high-confidence
# attack-family score before CRS 949110 evaluates the inbound anomaly total.
SecRule TX:lfi_score|TX:rfi_score|TX:rce_score|TX:php_injection_score|TX:sql_injection_score|TX:xss_score "@ge 5" \
    "id:1000001,phase:2,pass,nolog,ctl:ruleEngine=On,setvar:'tx.scene_selective_enforcement=1'"

# Backup/configuration filenames do not all contribute to a dedicated attack
# family score. Promote only explicit high-risk filename shapes; CRS still owns
# the actual deny decision and response.
SecRule REQUEST_URI "@rx (?i)(?:^|/)(?:\.env(?:[._~-][^/]*)?|\.git(?:/|$)|wp-config\.php|terraform\.tfstate(?:\.backup)?|[^/?]{1,180}(?:\.bak|\.backup|\.old|\.orig|\.save|\.swp|~))(?:$|[/?])" \
    "id:1000002,phase:2,pass,nolog,ctl:ruleEngine=On,setvar:'tx.scene_selective_enforcement=1'"
