version: 1
metadata:
  name: TorrentHarbor email magic-link authentication
entries:
  - identifiers:
      slug: torrentharbor-email-magic-link
    id: flow
    model: authentik_flows.flow
    attrs:
      name: TorrentHarbor Email Sign-In
      title: Check your email to continue
      designation: authentication
      authentication: require_unauthenticated
  - identifiers:
      name: torrentharbor-email-identification
    id: identification
    model: authentik_stages_identification.identificationstage
    attrs:
      user_fields:
        - email
      case_insensitive_matching: true
      show_matched_user: false
      pretend_user_exists: true
      template: stages/identification/login.html
  - identifiers:
      name: torrentharbor-email-magic-link
    id: email
    model: authentik_stages_email.emailstage
    attrs:
      use_global_settings: true
      token_expiry: minutes=15
      subject: Your TorrentHarbor sign-in link
      template: email/account_confirmation.html
      activate_user_on_success: false
      recovery_max_attempts: 5
      recovery_cache_timeout: minutes=5
  - identifiers:
      name: torrentharbor-email-login
    id: login
    model: authentik_stages_user_login.userloginstage
  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf identification
      order: 10
    model: authentik_flows.flowstagebinding
  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf email
      order: 20
    model: authentik_flows.flowstagebinding
  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf login
      order: 100
    model: authentik_flows.flowstagebinding
  - identifiers:
      name: access-portal-qr
    model: authentik_providers_oauth2.oauth2provider
    attrs:
      authentication_flow: !KeyOf flow
